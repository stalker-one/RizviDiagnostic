apply plugin: 'com.android.application'

// The startup MP4 is kept at src/main/res for compatibility with the existing
// repository layout. Android resource generation requires media resources to
// live under a typed directory such as res/raw, so copy it into a generated
// raw resource directory before Android resource processing.
def startupGeneratedResDir = layout.buildDirectory.dir('generated/res/startup').get().asFile

tasks.register('prepareStartupAnimationResource', Copy) {
    // CI workflows may create res/raw/startup_animation.mp4 for legacy builds.
    // Remove that duplicate before adding the generated resource so Android's
    // resource merger always has exactly one startup_animation resource.
    doFirst {
        delete file('src/main/res/raw/startup_animation.mp4')
    }
    from file('src/main/res/Rizvi_Android_Startup_2x.mp4')
    into new File(startupGeneratedResDir, 'raw')
    rename { 'startup_animation.mp4' }
}

android {
    namespace = "com.rizvi.diagnosticcenter"
    compileSdk = rootProject.ext.compileSdkVersion

    sourceSets {
        main {
            res.srcDir(startupGeneratedResDir)
        }
    }

    defaultConfig {
        applicationId "com.rizvi.diagnosticcenter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
        def releaseVersionCode = ciRunNumber ? Math.max(2, ciRunNumber.toInteger()) : 2
        versionCode releaseVersionCode
        versionName "1.0.${releaseVersionCode}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions += "app"
    productFlavors {
        regular {
            dimension "app"
            applicationId "com.rizvi.diagnosticcenter"
            resValue "string", "app_name", "Rizvi Diagnostic Center"
        }
        superadmin {
            dimension "app"
            applicationId "com.rizvi.diagnosticcenter.superadmin"
            resValue "string", "app_name", "Rizvi Diagnostic Center Superadmin"
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')

            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn 'prepareStartupAnimationResource'
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation platform("com.google.firebase:firebase-bom:34.9.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
