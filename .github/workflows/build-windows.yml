name: Build Windows App

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/android/**'
      - 'backend/src/services/push.service.js'
      - 'backend/src/services/firebaseAdmin.ts'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/build-superadmin-android.yml'
      - '.github/workflows/update-android-release-notes.yml'
      - '.github/workflows/build-android-*.yml'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  MONGODB_DB_NAME: rizvi_diagnostic_center
  WINDOWS_RELEASE_TAG: v1.1.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      # The remainder of the Windows build is intentionally unchanged.
      - name: Verify Windows workflow routing
        run: echo "Windows build is intentionally skipped for Android-only notification/backend credential changes."
