name: Build Windows App

on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/android/**'
      - 'backend/src/services/push.service.js'
      - 'backend/src/services/firebaseAdmin.ts'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/build-superadmin-android.yml'
      - '.github/workflows/update-android-release-notes.yml'
      - '.github/workflows/build-android-*.yml'
      - '.github/workflows/build-windows.yml'
      - 'update-manifest-android.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  MONGODB_DB_NAME: rizvi_diagnostic_center
  WINDOWS_RELEASE_TAG: v1.1.0
  PRODUCTION_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Prepare Windows application version
        shell: pwsh
        run: |
          $packagePath = 'electron/package.json'
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $sourceVersion = [version]$package.version
          if ($sourceVersion -lt [version]'0.0.1') { throw "Invalid Windows application version: $($package.version)" }
          $publishedVersion = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/stalker-one/RizviDiagnostic/releases/tags/$env:WINDOWS_RELEASE_TAG" -Headers @{ 'User-Agent'='Rizvi-Diagnostic-Center-Build'; 'Accept'='application/vnd.github+json'; 'Cache-Control'='no-cache' } -TimeoutSec 20
            $asset = @($release.assets) | Where-Object { $_.name -ieq 'windows-version.json' } | Select-Object -First 1
            if ($asset) {
              $manifestUrl = "{0}?t={1}" -f $asset.browser_download_url, [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
              $manifest = Invoke-RestMethod -Uri $manifestUrl -Headers @{ 'User-Agent'='Rizvi-Diagnostic-Center-Build'; 'Cache-Control'='no-cache' } -TimeoutSec 20
              if ($manifest.version) { $publishedVersion = [version]$manifest.version }
            }
          } catch { Write-Warning "Could not read the existing Windows manifest. Continuing with source version: $($_.Exception.Message)" }
          if ($publishedVersion -and $sourceVersion -le $publishedVersion) {
            $next = [version]::new($publishedVersion.Major, $publishedVersion.Minor, ($publishedVersion.Build + 1))
            $package.version = $next.ToString()
            $package | ConvertTo-Json -Depth 100 | Set-Content -Path $packagePath -Encoding UTF8
            $sourceVersion = $next
          }
          "WINDOWS_APP_VERSION=$sourceVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows build version: v$sourceVersion"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Configure Windows desktop database connection
        shell: pwsh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URI_2: ${{ secrets.MONGODB_URI_2 }}
          MONGODB_URI_3: ${{ secrets.MONGODB_URI_3 }}
          MONGODB_DB_NAME_SECRET: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          $uri = @($env:MONGODB_URI, $env:MONGODB_URI_2, $env:MONGODB_URI_3) | Where-Object { $_ -and ($_ -match '^mongodb(\+srv)?://') } | Select-Object -First 1
          if (-not $uri) { throw 'No valid MongoDB connection string is configured in GitHub Actions secrets.' }
          $uri = $uri.Trim()
          $dbName = if ($env:MONGODB_DB_NAME_SECRET) { $env:MONGODB_DB_NAME_SECRET.Trim() } else { 'rizvi_diagnostic_center' }
          if ($dbName -notmatch '^[A-Za-z0-9_-]+$') { throw 'MONGODB_DB_NAME contains unsupported characters.' }
          "MONGODB_URI=$uri`r`nMONGODB_DB_NAME=$dbName`r`nJWT_EXPIRES_IN=12h`r`nCLINIC_NAME=Rizvi Diagnostic Center`r`n" | Set-Content backend/.env -Encoding UTF8 -NoNewline
      - name: Verify MongoDB connection before packaging
        working-directory: backend
        shell: pwsh
        run: |
          $script = @'
          require('./src/env');
          const { MongoClient } = require('mongodb');
          const uri = process.env.MONGODB_URI?.trim(); const dbName = process.env.MONGODB_DB_NAME?.trim();
          if (!uri || !/^mongodb(\+srv)?:\/\//.test(uri)) throw new Error('MONGODB_URI is missing or invalid after dotenv parsing');
          const client = new MongoClient(uri, { serverSelectionTimeoutMS: 20000, connectTimeoutMS: 20000, family: 4 });
          client.connect().then(async () => { await client.db(dbName).command({ ping: 1 }); console.log('MongoDB Atlas ping: OK'); await client.close(); }).catch(async e => { console.error('MongoDB Atlas ping failed:', e.message); try { await client.close(); } catch {} process.exit(1); });
          '@
          Set-Content verify-mongodb.cjs $script -Encoding UTF8
          node verify-mongodb.cjs
          Remove-Item verify-mongodb.cjs -Force -ErrorAction SilentlyContinue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.PRODUCTION_API_BASE_URL }}
        run: npm run build
      - name: Prepare shared Rizvi application icon
        shell: pwsh
        run: |
          $iconUrl = 'https://raw.githubusercontent.com/stalker-one/RizviDiagnostic/main/frontend/android/app/src/main/res/Icon.jpg'
          New-Item -ItemType Directory -Force -Path electron/build | Out-Null
          $iconDownloadUrl = "{0}?t={1}" -f $iconUrl, [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          Invoke-WebRequest -Uri $iconDownloadUrl -OutFile electron/build/icon.jpg -Headers @{ 'User-Agent'='Rizvi-Diagnostic-Center-Build' }
          if (-not (Test-Path electron/build/icon.jpg) -or (Get-Item electron/build/icon.jpg).Length -lt 1000) { throw 'Shared Icon.jpg could not be downloaded.' }
          if (Get-Command magick -ErrorAction SilentlyContinue) { magick electron/build/icon.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 electron/build/icon.png } elseif (Get-Command convert -ErrorAction SilentlyContinue) { convert electron/build/icon.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 electron/build/icon.png } else { throw 'ImageMagick is not available on the Windows runner; cannot generate the Windows icon.' }
          if (-not (Test-Path electron/build/icon.png) -or (Get-Item electron/build/icon.png).Length -lt 1000) { throw 'Windows icon PNG was not generated.' }
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install
      - name: Build Windows installer
        working-directory: electron
        run: npm run dist -- --publish never
      - name: Verify installer and updater metadata
        shell: pwsh
        working-directory: electron
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json; $version = $package.version
          $exe = Get-ChildItem -Path dist-installer -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer EXE was not produced.' }
          if ($exe.Length -lt 100KB) { throw 'Windows installer is unexpectedly small.' }
          if (-not (Get-ChildItem -Path dist-installer -Filter latest.yml -File | Select-Object -First 1)) { throw 'electron-builder did not produce latest.yml.' }
          [ordered]@{ version=$version; notes="Rizvi Diagnostic Center Windows v$version`nLatest Windows application build with current fixes and improvements."; publishedAt=(Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content dist-installer\windows-version.json -Encoding UTF8
          Get-FileHash $exe -Algorithm SHA256
      - name: Prepare release files
        shell: pwsh
        working-directory: electron
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item dist-installer\*.exe release-files -Force
          Copy-Item dist-installer\latest.yml release-files -Force
          Copy-Item dist-installer\windows-version.json release-files -Force
          Get-ChildItem dist-installer -Filter *.blockmap -File | Copy-Item -Destination release-files -Force -ErrorAction SilentlyContinue
      - name: Remove stale installer assets from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $assets = gh release view v1.1.0 --repo stalker-one/RizviDiagnostic --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets) { foreach ($name in ($assets -split "`n")) { $name=$name.Trim(); if ($name -match '\.(exe|blockmap)$') { gh release delete-asset v1.1.0 $name --repo stalker-one/RizviDiagnostic --yes 2>$null } } }
      - name: Replace existing Windows release with latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Rizvi Diagnostic Center Windows — Latest
          body: |
            # Rizvi Diagnostic Center — Windows
            This single Windows release always contains the latest Windows build.
          files: electron/release-files/*
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload latest Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rizvi-Diagnostic-Center-Windows-latest
          path: electron/release-files/*
          retention-days: 90
