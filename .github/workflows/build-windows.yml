name: Build Windows App

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  MONGODB_DB_NAME: rizvi_diagnostic_center
  WINDOWS_RELEASE_TAG: v1.1.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Validate Windows application version is new
        shell: pwsh
        run: |
          $package = Get-Content electron/package.json -Raw | ConvertFrom-Json
          $current = [version]$package.version
          if ($current -lt [version]'0.0.1') { throw "Invalid Windows application version: $($package.version)" }
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/stalker-one/RizviDiagnostic/releases/tags/$env:WINDOWS_RELEASE_TAG" -Headers @{ 'User-Agent'='Rizvi-Diagnostic-Center-Build'; 'Accept'='application/vnd.github+json' } -TimeoutSec 20
            $asset = @($release.assets) | Where-Object { $_.name -ieq 'windows-version.json' } | Select-Object -First 1
            if ($asset) {
              $manifest = Invoke-RestMethod -Uri $asset.browser_download_url -Headers @{ 'User-Agent'='Rizvi-Diagnostic-Center-Build' } -TimeoutSec 20
              if ($manifest.version) {
                $latest = [version]$manifest.version
                if ($current -le $latest) { throw "Windows version must increase for every Windows application update. Current source version v$current is not newer than published v$latest." }
                Write-Host "Version check passed: published v$latest -> source v$current"
              }
            } else {
              Write-Host 'No existing Windows version manifest found; allowing initial Windows release build.'
            }
          } catch {
            if ($_.Exception.Message -like 'Windows version must increase*') { throw }
            Write-Warning "Could not read the existing Windows manifest. Continuing only because the release may not have a readable manifest: $($_.Exception.Message)"
          }
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Configure Windows desktop database connection
        shell: pwsh
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_URI_2: ${{ secrets.MONGODB_URI_2 }}
          MONGODB_URI_3: ${{ secrets.MONGODB_URI_3 }}
          MONGODB_DB_NAME_SECRET: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          $uri = @($env:MONGODB_URI, $env:MONGODB_URI_2, $env:MONGODB_URI_3) | Where-Object { $_ -and ($_ -match '^mongodb(\+srv)?://') } | Select-Object -First 1
          if (-not $uri) { throw 'No valid MongoDB connection string is configured in GitHub Actions secrets.' }
          $uri = $uri.Trim()
          $dbName = if ($env:MONGODB_DB_NAME_SECRET) { $env:MONGODB_DB_NAME_SECRET.Trim() } else { 'rizvi_diagnostic_center' }
          if ($dbName -notmatch '^[A-Za-z0-9_-]+$') { throw 'MONGODB_DB_NAME contains unsupported characters.' }
          $envText = "MONGODB_URI=$uri`r`nMONGODB_DB_NAME=$dbName`r`nJWT_EXPIRES_IN=12h`r`nCLINIC_NAME=Rizvi Diagnostic Center`r`n"
          Set-Content -Path backend/.env -Value $envText -Encoding UTF8 -NoNewline
          $parsed = Get-Content backend/.env -Raw | ConvertFrom-StringData
          if ($parsed['MONGODB_URI'] -ne $uri) { throw 'MONGODB_URI was not preserved as a single .env value.' }
          if ($parsed['MONGODB_DB_NAME'] -ne $dbName) { throw 'MONGODB_DB_NAME was not preserved correctly.' }
          Write-Host 'Windows desktop MongoDB configuration created and .env parsing validated (URI hidden).'
      - name: Verify MongoDB connection before packaging
        working-directory: backend
        shell: pwsh
        run: |
          $script = @'
          require('./src/env');
          const { MongoClient } = require('mongodb');
          const uri = process.env.MONGODB_URI?.trim();
          const dbName = process.env.MONGODB_DB_NAME?.trim();
          if (!uri || !/^mongodb(\+srv)?:\/\//.test(uri)) throw new Error('MONGODB_URI is missing or invalid after dotenv parsing');
          if (!dbName) throw new Error('MONGODB_DB_NAME is missing');
          const parsed = new URL(uri);
          if (!parsed.hostname) throw new Error('MONGODB_URI has no hostname');
          console.log(`MongoDB URI validated for host ${parsed.hostname}; secret value hidden`);
          const client = new MongoClient(uri, { serverSelectionTimeoutMS: 20000, connectTimeoutMS: 20000, family: 4 });
          client.connect().then(async () => { await client.db(dbName).command({ ping: 1 }); console.log('MongoDB Atlas ping: OK'); await client.close(); }).catch(async (error) => { console.error('MongoDB Atlas ping failed:', error.message); try { await client.close(); } catch {} process.exit(1); });
          '@
          Set-Content -Path verify-mongodb.cjs -Value $script -Encoding UTF8
          node verify-mongodb.cjs
          Remove-Item verify-mongodb.cjs -Force -ErrorAction SilentlyContinue
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
        run: npm run build
      - name: Install Electron dependencies
        working-directory: electron
        run: npm install
      - name: Build Windows installer
        working-directory: electron
        run: npm run dist -- --publish never
      - name: Verify installer and updater metadata
        shell: pwsh
        working-directory: electron
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $exe = Get-ChildItem -Path dist-installer -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer EXE was not produced.' }
          if ($exe.Length -lt 100KB) { throw 'Windows installer is unexpectedly small.' }
          $latest = Get-ChildItem -Path dist-installer -Filter latest.yml -File | Select-Object -First 1
          if (-not $latest) { throw 'electron-builder did not produce latest.yml.' }
          $manifest = [ordered]@{ version = $version; notes = "Rizvi Diagnostic Center Windows v$version`nLatest Windows application build with current fixes and improvements."; publishedAt = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json
          Set-Content -Path dist-installer\windows-version.json -Value $manifest -Encoding UTF8
          Write-Host "Windows build version: v$version"
          Write-Host "Installer: $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host 'Windows version manifest created.'
          Get-FileHash $exe -Algorithm SHA256
      - name: Prepare release files
        shell: pwsh
        working-directory: electron
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item dist-installer\*.exe release-files\ -Force
          Copy-Item dist-installer\latest.yml release-files\ -Force
          Copy-Item dist-installer\windows-version.json release-files\ -Force
          Get-ChildItem dist-installer -Filter *.blockmap -File | Copy-Item -Destination release-files -Force -ErrorAction SilentlyContinue
      - name: Remove stale installer assets from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          # artifactName embeds the version (Setup-${version}.exe), so
          # overwrite_files below only replaces an asset with the exact same
          # filename — it never removes older-versioned installers already
          # on the release. Left alone they pile up release after release,
          # and the desktop app's update picker could grab a stale one.
          $assets = gh release view v1.1.0 --repo stalker-one/RizviDiagnostic --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets) {
            foreach ($name in ($assets -split "`n")) {
              $name = $name.Trim()
              if ($name -match '\.(exe|blockmap)$') {
                Write-Host "Deleting stale release asset: $name"
                gh release delete-asset v1.1.0 $name --repo stalker-one/RizviDiagnostic --yes 2>$null
              }
            }
          } else {
            Write-Host 'No existing release assets found (first release) — nothing to clean up.'
          }
      - name: Replace existing Windows release with latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Rizvi Diagnostic Center Windows — Latest
          body: |
            # Rizvi Diagnostic Center — Windows

            This single Windows release always contains the latest Windows build.

            The user-facing Windows application version increases for every application update (for example v1.1.4 → v1.1.5). The GitHub release tag remains v1.1.0 as the stable Windows channel.

            Older Windows installer assets are replaced after every successful build.
          files: electron/release-files/*
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload latest Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rizvi-Diagnostic-Center-Windows-latest
          path: electron/release-files/*
          retention-days: 90
