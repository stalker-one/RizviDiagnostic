name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/services/push.service.js'
      - 'backend/src/services/firebaseAdmin.ts'
      - '.github/workflows/build-android.yml'
      - '.github/android-signing/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api
  STARTUP_VIDEO_URL: https://raw.githubusercontent.com/stalker-one/RizviDiagnostic/main/frontend/android/app/src/main/res/Rizvi_Android_Startup_2x.mp4

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and normalize startup animation for Android
        run: |
          set -euo pipefail
          SOURCE_VIDEO="frontend/android/app/src/main/res/Rizvi_Android_Startup_2x.mp4"
          test -s "$SOURCE_VIDEO"
          mkdir -p frontend/android/app/src/main/res/raw
          cp "$SOURCE_VIDEO" /tmp/startup-source.mp4
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -y -i /tmp/startup-source.mp4 -map 0:v:0 -map 0:a:0? -vf "scale='min(1920,iw)':'min(1920,ih)':force_original_aspect_ratio=decrease,pad=ceil(iw/2)*2:ceil(ih/2)*2:(ow-iw)/2:(oh-ih)/2,format=yuv420p" -c:v libx264 -profile:v main -level 4.0 -pix_fmt yuv420p -preset medium -crf 20 -c:a aac -b:a 128k -ar 44100 -ac 2 -movflags +faststart -shortest frontend/android/app/src/main/res/raw/startup_animation.mp4
          test -s frontend/android/app/src/main/res/raw/startup_animation.mp4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Build frontend for production API
        working-directory: frontend
        run: npm run build
      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=''
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Restore existing Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p .github/android-signing
          rm -f "$ANDROID_KEYSTORE_PATH"
          if [ -s .github/android-signing/keystore.p12.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_KEYSTORE_PASSWORD -in .github/android-signing/keystore.p12.enc -out "$ANDROID_KEYSTORE_PATH" 2>/tmp/keystore.err || true; fi
          if [ ! -s "$ANDROID_KEYSTORE_PATH" ] && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$ANDROID_KEYSTORE_PATH" 2>/tmp/base64.err || rm -f "$ANDROID_KEYSTORE_PATH"; fi
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleRegularRelease --stacktrace
      - name: Verify Android APK signature and metadata
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/regular/release/app-regular-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E 'package:|versionCode|versionName'
      - name: Calculate release APK integrity hash and size
        run: |
          set -euo pipefail
          APK="frontend/android/app/build/outputs/apk/regular/release/app-regular-release.apk"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"
      - name: Generate changelog since last release
        run: |
          set -euo pipefail
          git fetch origin 'refs/tags/android-latest:refs/tags/android-latest' 2>/dev/null || true
          PREV_SHA="$(git rev-list -n1 android-latest 2>/dev/null || true)"
          if [ -n "$PREV_SHA" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then RANGE="${PREV_SHA}..HEAD"; else RANGE="HEAD"; fi
          mapfile -t CHANGES < <(git log $RANGE --no-merges --pretty=format:'%s' -- frontend/ backend/src/services/push.service.js backend/src/services/firebaseAdmin.ts | grep -viE '^(Update (Staff|Superadmin) Android update manifest)' | awk '!seen[$0]++' | head -n 12)
          if [ ${#CHANGES[@]} -eq 0 ]; then CHANGES=("General improvements and bug fixes."); fi
          : > whats-new.md
          for line in "${CHANGES[@]}"; do echo "- $line" >> whats-new.md; done
          { echo "## What's New"; cat whats-new.md; echo; echo "## Build information"; echo "Version code: ${{ github.run_number }}"; echo "Version name: 1.0.${{ github.run_number }}"; echo "APK SHA-256: ${APK_SHA256}"; echo "APK size: ${APK_SIZE} bytes"; } > release-notes.md
      - name: Prepare release APK
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cp frontend/android/app/build/outputs/apk/regular/release/app-regular-release.apk dist-android/RizviDiagnosticCenter-latest.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticCenter-android
          path: dist-android/RizviDiagnosticCenter-latest.apk
          retention-days: 90
      - name: Publish android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Rizvi Diagnostic Center ${{ github.run_number }}
          body_path: release-notes.md
          files: dist-android/RizviDiagnosticCenter-latest.apk
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Staff update manifest without overwriting Superadmin
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main
          if [ ! -s update-manifest-android.json ]; then echo '{"staff":{},"superadmin":{}}' > update-manifest-android.json; fi
          tmp="$(mktemp)"
          jq --argjson code "${{ github.run_number }}" --arg version "1.0.${{ github.run_number }}" --arg hash "$APK_SHA256" --argjson size "$APK_SIZE" --rawfile notes whats-new.md '.staff={tag:"android-latest",versionCode:$code,versionName:$version,apkUrl:"https://github.com/stalker-one/RizviDiagnostic/releases/download/android-latest/RizviDiagnosticCenter-latest.apk",sha256:$hash,sizeBytes:$size,releaseNotes:($notes|rtrimstr("\n"))} | .updatedAt="${{ github.sha }}"' update-manifest-android.json > "$tmp"
          mv "$tmp" update-manifest-android.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest-android.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Staff Android update manifest [skip ci]"
          git push origin HEAD:main
      - name: Trigger instant update-available push notification
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TRIGGER_SECRET:-}" ]; then exit 0; fi
          curl -sf -X POST "https://stalker-one-rizvidiagnostic.vercel.app/api/push/notify-update" -H "Content-Type: application/json" -H "X-Push-Secret: ${PUSH_TRIGGER_SECRET}" -d "{\"appVariant\":\"staff\",\"versionName\":\"1.0.${{ github.run_number }}\",\"versionCode\":${{ github.run_number }}}" || echo "Push trigger failed (non-fatal)."
        env:
          PUSH_TRIGGER_SECRET: ${{ secrets.PUSH_TRIGGER_SECRET }}
      - name: Remove signing keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
