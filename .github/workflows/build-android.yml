name: Build Android App

# Builds the Capacitor-wrapped frontend into a real installable Android APK.
# The packaged app must use the current public Vercel API URL because a native
# app does not share the browser's same-origin /api path.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # IMPORTANT: this must match the current production Vercel deployment.
      # The old rizvi-diagnostic-chi.vercel.app domain is no longer the live API.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api
        run: npm run build

      - name: Sync Capacitor Android project with latest build
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK with version + commit for clarity
        working-directory: frontend/android
        run: |
          mkdir -p ../../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk \
             ../../dist-android/RizviDiagnosticCenter-${{ github.run_number }}-${{ github.sha }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticCenter-android
          path: dist-android/*.apk
          retention-days: 90

      - name: Publish to android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 'Android App (latest build)'
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.
            This is a debug-signed APK for sideloading — not from the Play Store.
            The app is configured to use the current Rizvi Diagnostic production API.
          files: dist-android/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
