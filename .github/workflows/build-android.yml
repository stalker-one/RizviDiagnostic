name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
      - '.github/android-signing/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api
  STARTUP_VIDEO_URL: https://res.cloudinary.com/v0h2hc0b/video/upload/Create_3D_animation_video_202608210408.mp4

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and normalize startup animation for Android
        run: |
          set -euo pipefail
          mkdir -p frontend/android/app/src/main/res/raw
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 600 \
            -o /tmp/startup-source.mp4 "$STARTUP_VIDEO_URL"
          test -s /tmp/startup-source.mp4
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo 'Source video:'
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,codec_type,width,height,pix_fmt,r_frame_rate,profile -of default=noprint_wrappers=1 /tmp/startup-source.mp4
          ffmpeg -y -i /tmp/startup-source.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -vf "scale='min(1920,iw)':'min(1920,ih)':force_original_aspect_ratio=decrease,pad=ceil(iw/2)*2:ceil(ih/2)*2:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 -profile:v main -level 4.0 -pix_fmt yuv420p -preset medium -crf 20 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -movflags +faststart -shortest \
            frontend/android/app/src/main/res/raw/startup_animation.mp4
          test -s frontend/android/app/src/main/res/raw/startup_animation.mp4
          echo 'Android-compatible video:'
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,codec_type,width,height,pix_fmt,r_frame_rate,profile -of default=noprint_wrappers=1 frontend/android/app/src/main/res/raw/startup_animation.mp4
          sha256sum frontend/android/app/src/main/res/raw/startup_animation.mp4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Build frontend for production API
        working-directory: frontend
        run: npm run build
      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=''
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'Android sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Validate signing configuration
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
      - name: Restore existing Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .github/android-signing
          rm -f "$ANDROID_KEYSTORE_PATH"
          if [ -s .github/android-signing/keystore.p12.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_KEYSTORE_PASSWORD -in .github/android-signing/keystore.p12.enc -out "$ANDROID_KEYSTORE_PATH" 2>/tmp/keystore.err || true
          fi
          if [ ! -s "$ANDROID_KEYSTORE_PATH" ] && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            NORMALIZED_B64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
            NORMALIZED_B64="${NORMALIZED_B64#\"}"; NORMALIZED_B64="${NORMALIZED_B64%\"}"
            NORMALIZED_B64="${NORMALIZED_B64#\'}"; NORMALIZED_B64="${NORMALIZED_B64%\'}"
            if printf '%s' "$NORMALIZED_B64" | grep -qi '^data:'; then NORMALIZED_B64="${NORMALIZED_B64#*,}"; fi
            printf '%s' "$NORMALIZED_B64" | tr '_-' '/+' | base64 --decode > "$ANDROID_KEYSTORE_PATH" 2>/tmp/base64.err || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
          test -s "$ANDROID_KEYSTORE_PATH" || { echo 'Existing Android signing keystore could not be restored. Refusing to generate a new signing key because that would break installed-app updates.'; cat /tmp/keystore.err 2>/dev/null || true; cat /tmp/base64.err 2>/dev/null || true; exit 1; }
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleRegularRelease --stacktrace
      - name: Verify Android APK signature and metadata
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/regular/release/app-regular-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E 'package:|versionCode|versionName'
      - name: Calculate release APK integrity hash
        run: |
          set -euo pipefail
          APK="frontend/android/app/build/outputs/apk/regular/release/app-regular-release.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
      - name: Prepare release APK
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cp frontend/android/app/build/outputs/apk/regular/release/app-regular-release.apk dist-android/RizviDiagnosticCenter-latest.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticCenter-android
          path: dist-android/RizviDiagnosticCenter-latest.apk
          retention-days: 90
      - name: Publish android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android App (latest build)
          body: |
            # What's new
            - Added the Rizvi Diagnostic Center 3D startup animation.
            - Startup video is normalized to Android-safe H.264/AAC/YUV420P before packaging.
            - Startup animation plays fullscreen and automatically opens the application when finished.
            - Improved authenticated session resume so logged-in staff return to Dashboard.
            - Separated Simple/A4 Paid Stamp settings from Thermal Paid Stamp settings.
            - Improved Thermal and Simple invoice printing.
            - Added secure APK signature and integrity verification.
            - Includes bug fixes and performance improvements.

            # Build information
            Package: com.rizvi.diagnosticcenter
            Version code: ${{ github.run_number }}
            Version name: 1.0.${{ github.run_number }}
            Commit: ${{ github.sha }}
            APK SHA-256: ${{ env.APK_SHA256 }}
            Release-signed APK for sideloading.
          files: dist-android/RizviDiagnosticCenter-latest.apk
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove signing keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
