name: Build Android App

# Runs on GitHub's own servers, not in any sandboxed dev environment — this
# is what actually compiles the Capacitor-wrapped frontend into a real,
# installable Android APK. Builds automatically on every push to main that
# touches the frontend, and can also be triggered manually from the Actions
# tab (the "Run workflow" button) any time you just want a fresh build.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # VITE_API_BASE_URL points the packaged app at your live Vercel API
      # (there's no "same origin" for a native app the way there is for a
      # website, so it needs the full URL baked in at build time).
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://rizvi-diagnostic-chi.vercel.app/api
        run: npm run build

      - name: Sync Capacitor Android project with latest build
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK with version + commit for clarity
        working-directory: frontend/android
        run: |
          mkdir -p ../../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk \
             ../../dist-android/RizviDiagnosticCenter-${{ github.run_number }}-${{ github.sha }}.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticCenter-android
          path: dist-android/*.apk
          retention-days: 90

      # Also publishes to a standing "android-latest" GitHub Release so
      # there's always one stable download link, without having to dig
      # through individual Actions run pages each time.
      - name: Publish to "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 'Android App (latest build)'
          body: |
            Automatically rebuilt from commit ${{ github.sha }} on ${{ github.event.repository.updated_at }}.
            This is a debug-signed APK for sideloading — not from the Play Store.
            To install: download the .apk on your Android phone, then open it
            (you may need to allow "Install unknown apps" for your browser/
            files app the first time).
          files: dist-android/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
