name: Build Android App

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend for production API
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS secret'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD secret'; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          echo "All Android signing secrets are present. Base64 secret length: ${#ANDROID_KEYSTORE_BASE64} characters."

      - name: Restore Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re, urllib.parse

          raw = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          value = raw.strip().lstrip('\ufeff')
          if value.lower().startswith('data:') and ',' in value:
              value = value.split(',', 1)[1]
          value = urllib.parse.unquote(value)
          value = value.replace('\\r', '').replace('\\n', '')
          value = re.sub(r'\s+', '', value)
          value = value.strip('"\'')
          value = value.replace('-', '+').replace('_', '/')
          value = value.rstrip('=')

          if not value:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is empty.')

          candidates = [value]
          filtered = re.sub(r'[^A-Za-z0-9+/=]', '', value)
          if filtered != value:
              candidates.append(filtered.rstrip('='))

          data = None
          for candidate in candidates:
              padded = candidate + ('=' * (-len(candidate) % 4))
              try:
                  decoded = base64.b64decode(padded, validate=True)
                  if len(decoded) >= 100:
                      data = decoded
                      break
              except Exception:
                  pass

          if data is None:
              raise SystemExit(
                  'ANDROID_KEYSTORE_BASE64 could not be decoded as a valid keystore. '
                  'Regenerate this secret directly from the original .jks/.keystore file using '
                  '[Convert]::ToBase64String([IO.File]::ReadAllBytes("FILE")) in PowerShell.'
              )

          path = os.environ['ANDROID_KEYSTORE_PATH']
          with open(path, 'wb') as f:
              f.write(data)
          os.chmod(path, 0o600)
          print(f'Keystore restored successfully ({len(data)} bytes).')
          PY

      - name: Verify signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo 'Signing keystore, password, and alias verified.'

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Verify APK signature and metadata
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E 'package:|versionCode|versionName'

      - name: Prepare release APK
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "dist-android/RizviDiagnosticCenter-${{ github.run_number }}-${{ github.sha }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticCenter-android
          path: dist-android/*.apk
          retention-days: 90

      - name: Publish android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android App (latest build)
          body: |
            Automatically rebuilt from commit ${{ github.sha }}.
            Release-signed APK for sideloading.
            Package: com.rizvi.diagnosticcenter
            Version code: ${{ github.run_number }}.
            API: https://stalker-one-rizvidiagnostic.vercel.app/api
          files: dist-android/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
