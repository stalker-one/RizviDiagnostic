name: Build Superadmin Android App

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-superadmin-android.yml'
      - '.github/android-signing/**'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-superadmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use uploaded Superadmin startup video
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_VIDEO="frontend/android/app/src/main/res/Rizvi_Android_Startup_2x.mp4"
          test -s "$SOURCE_VIDEO"
          mkdir -p frontend/android/app/src/main/res/raw
          cp "$SOURCE_VIDEO" /tmp/startup-source.mp4
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -y -i /tmp/startup-source.mp4 \
            -map 0:v:0 -map 0:a:0? \
            -vf "scale='min(1920,iw)':'min(1920,ih)':force_original_aspect_ratio=decrease,pad=ceil(iw/2)*2:ceil(ih/2)*2:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 -profile:v main -level 4.0 -pix_fmt yuv420p -preset medium -crf 20 \
            -c:a aac -b:a 128k -ar 44100 -ac 2 -movflags +faststart -shortest \
            frontend/android/app/src/main/res/raw/startup_animation.mp4
          test -s frontend/android/app/src/main/res/raw/startup_animation.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Build Superadmin frontend and sync Android
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api
          VITE_SUPERADMIN_APP: 'true'
        run: |
          set -euo pipefail
          npm run build
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=''
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"; fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore existing Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p .github/android-signing
          rm -f "$ANDROID_KEYSTORE_PATH"
          if [ -s .github/android-signing/keystore.p12.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_KEYSTORE_PASSWORD -in .github/android-signing/keystore.p12.enc -out "$ANDROID_KEYSTORE_PATH" 2>/tmp/keystore.err || true
          fi
          if [ ! -s "$ANDROID_KEYSTORE_PATH" ] && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$ANDROID_KEYSTORE_PATH" 2>/tmp/base64.err || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - name: Build Superadmin APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleSuperadminRelease --stacktrace
          APK="app/build/outputs/apk/superadmin/release/app-superadmin-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E 'package:|versionCode|versionName'
          mkdir -p dist-superadmin
          cp "$APK" "dist-superadmin/RizviDiagnosticSuperadmin-latest.apk"
      - name: Calculate release APK integrity hash and size
        run: |
          set -euo pipefail
          APK="frontend/android/app/build/outputs/apk/superadmin/release/app-superadmin-release.apk"
          echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"
      - name: Upload Superadmin APK
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticSuperadmin-android
          path: frontend/android/dist-superadmin/RizviDiagnosticSuperadmin-latest.apk
          retention-days: 90
          if-no-files-found: error
      - name: Publish Superadmin latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-superadmin-latest
          name: Rizvi Diagnostic Center Superadmin ${{ github.run_number }}
          body: |
            ## What's New
            - Latest Superadmin update from commit ${{ github.sha }}.

            ## Build information
            Version code: ${{ github.run_number }}
            Version name: 1.0.${{ github.run_number }}
            APK SHA-256: ${{ env.APK_SHA256 }}
            APK size: ${{ env.APK_SIZE }} bytes
          files: frontend/android/dist-superadmin/RizviDiagnosticSuperadmin-latest.apk
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove signing keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
