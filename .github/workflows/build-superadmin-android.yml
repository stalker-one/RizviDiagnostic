name: Build Superadmin Android App

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-superadmin-android.yml'
      - '.github/android-signing/**'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-superadmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=''
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo 'sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" platform-tools 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore or create persistent Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          mkdir -p .github/android-signing
          GENERATED=false
          rm -f "$ANDROID_KEYSTORE_PATH"

          if [ -s .github/android-signing/keystore.p12.enc ]; then
            echo 'Restoring repository-persisted encrypted signing keystore...'
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_KEYSTORE_PASSWORD \
              -in .github/android-signing/keystore.p12.enc -out "$ANDROID_KEYSTORE_PATH" 2>/tmp/keystore.err || true
            if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              echo 'Persisted keystore is not usable with current credentials.'
              rm -f "$ANDROID_KEYSTORE_PATH"
            fi
          fi

          if [ ! -s "$ANDROID_KEYSTORE_PATH" ] && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            python3 - <<'PY'
import base64, os, re, urllib.parse
v=urllib.parse.unquote(os.environ.get('ANDROID_KEYSTORE_BASE64','').strip().lstrip('\ufeff'))
if v.lower().startswith('data:') and ',' in v: v=v.split(',',1)[1]
v=re.sub(r'\s+','',v).strip('"\'').replace('-','+').replace('_','/').rstrip('=')
try: data=base64.b64decode(v+'='*(-len(v)%4),validate=True)
except Exception: data=b''
if data: open(os.environ['ANDROID_KEYSTORE_PATH'],'wb').write(data)
PY
            chmod 600 "$ANDROID_KEYSTORE_PATH" || true
            if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              rm -f "$ANDROID_KEYSTORE_PATH"
            fi
          fi

          if [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo 'Creating a persistent signing keystore for the Android release channels.'
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -dname 'CN=Rizvi Diagnostic Center, OU=Mobile, O=Rizvi Diagnostic Center, L=Unknown, ST=Unknown, C=PK'
            chmod 600 "$ANDROID_KEYSTORE_PATH"
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            openssl enc -aes-256-cbc -pbkdf2 -pass env:ANDROID_KEYSTORE_PASSWORD \
              -in "$ANDROID_KEYSTORE_PATH" -out .github/android-signing/keystore.p12.enc
            chmod 600 .github/android-signing/keystore.p12.enc
            GENERATED=true
          fi

          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          if [ "$GENERATED" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/android-signing/keystore.p12.enc
            git commit -m 'Persist Android signing keystore securely' || true
            git push origin HEAD:main
          fi
      - name: Build Superadmin frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://stalker-one-rizvidiagnostic.vercel.app/api
          VITE_SUPERADMIN_APP: 'true'
        run: |
          npm run build
          npx cap sync android
      - name: Build Superadmin APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleSuperadminRelease --stacktrace
          APK=app/build/outputs/apk/release/app-superadmin-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist-superadmin
          cp "$APK" "dist-superadmin/RizviDiagnosticSuperadmin-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.apk"
      - name: Upload Superadmin APK
        uses: actions/upload-artifact@v4
        with:
          name: RizviDiagnosticSuperadmin-android
          path: dist-superadmin/*.apk
          retention-days: 90
      - name: Publish Superadmin latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-superadmin-latest
          name: Android Superadmin App (latest build)
          body: |
            Dedicated Superadmin Android application.
            Package: com.rizvi.diagnosticcenter.superadmin
            Login route: /adminlogin
            Version code: ${{ github.run_number }}.
            Built from commit ${{ github.sha }}.
          files: dist-superadmin/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove signing keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
