name: Repair Android release metadata

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Android App, Build Superadmin Android App]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Repair release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          repair() {
            tag="$1"; app="$2"; asset="$3"; workflow="$4"

            if [ "$EVENT_NAME" = "workflow_run" ]; then
              id="$TRIGGER_ID"
              sha="$TRIGGER_SHA"
            else
              data="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=main&status=success&per_page=1")"
              id="$(jq -r '.workflow_runs[0].id // empty' <<<"$data")"
              [ -n "$id" ] || { echo "No successful run for $workflow"; return; }
              sha="$(jq -r '.workflow_runs[0].head_sha' <<<"$data")"
            fi

            run="$(gh api "repos/$REPO/actions/runs/$id")"
            code="$(jq -r '.run_number' <<<"$run")"
            version="1.0.$code"

            release="$(gh api "repos/$REPO/releases/tags/$tag" 2>/dev/null || true)"
            [ -n "$release" ] || { echo "Release $tag is not available yet"; return; }
            release_id="$(jq -r '.id' <<<"$release")"

            dir="$(mktemp -d)"
            gh release download "$tag" --repo "$REPO" --pattern "$asset" --dir "$dir" --clobber
            apk="$dir/$asset"
            test -s "$apk"
            hash="$(sha256sum "$apk" | awk '{print tolower($1)}')"
            size="$(stat -c '%s' "$apk")"
            test "${#hash}" -eq 64

            change="$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message' | head -n1 | tr '\r\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | cut -c1-300)"
            [ -n "$change" ] || change="Latest bug fixes and improvements."

            # Keep release body machine-readable and user-facing What's New clean.
            body="## What's New

- $change

## Build information

Version code: $code
Version name: $version
APK SHA-256: $hash
APK size: $size"

            gh api "repos/$REPO/releases/$release_id" -X PATCH \
              -f "name=$app $version" \
              -f "body=$body" >/dev/null

            rm -rf "$dir"
            echo "OK: $tag $version build $code SHA-256 $hash"
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            case "$TRIGGER_NAME" in
              "Build Android App") repair android-latest "Rizvi Diagnostic Center" RizviDiagnosticCenter-latest.apk build-android.yml ;;
              "Build Superadmin Android App") repair android-superadmin-latest "Rizvi Diagnostic Center Superadmin" RizviDiagnosticSuperadmin-latest.apk build-superadmin-android.yml ;;
              *) echo "Ignoring $TRIGGER_NAME" ;;
            esac
          else
            repair android-latest "Rizvi Diagnostic Center" RizviDiagnosticCenter-latest.apk build-android.yml
            repair android-superadmin-latest "Rizvi Diagnostic Center Superadmin" RizviDiagnosticSuperadmin-latest.apk build-superadmin-android.yml
          fi
