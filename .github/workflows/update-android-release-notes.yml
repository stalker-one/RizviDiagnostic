name: Keep Android release notes latest-only

on:
  workflow_run:
    workflows:
      - Build Android App
      - Build Superadmin Android App
    types: [completed]

permissions:
  contents: write

jobs:
  latest-only:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_NAME" = "Build Superadmin Android App" ]; then
            TAG="android-superadmin-latest"
            APP="Rizvi Diagnostic Center Superadmin"
          else
            TAG="android-latest"
            APP="Rizvi Diagnostic Center"
          fi

          VERSION_NAME="1.0.${RUN_NUMBER}"
          RELEASE_JSON="$(gh api "repos/$REPO/releases/tags/$TAG")"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"

          # Use the actual latest commit subject as the single What's New item.
          # Do not expose build metadata, commit hashes, or historical notes in the modal.
          LATEST_CHANGE="$(gh api "repos/$REPO/commits/$RUN_SHA" --jq '.commit.message' | head -n 1 | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$LATEST_CHANGE" ]; then
            LATEST_CHANGE="Latest bug fixes and improvements."
          fi

          BODY=$(cat <<EOF
## What's New

- ${LATEST_CHANGE}

## Build information

Version code: ${RUN_NUMBER}
Version name: ${VERSION_NAME}
Commit: ${RUN_SHA}
EOF
)

          gh api "repos/$REPO/releases/$RELEASE_ID" -X PATCH -f body="$BODY" >/dev/null
          echo "Updated $TAG release notes with one latest change and valid numeric version metadata."
