name: Keep Android release notes latest-only

on:
  workflow_run:
    workflows:
      - Build Android App
      - Build Superadmin Android App
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Android release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            WORKFLOW_NAME="$TRIGGER_WORKFLOW"
            RUN_ID="$TRIGGER_RUN_ID"
            RUN_SHA="$TRIGGER_SHA"
          else
            WORKFLOW_NAME=""
            RUN_ID=""
            RUN_SHA=""
          fi

          update_release() {
            local workflow_file="$1"
            local tag="$2"
            local app="$3"

            local run_id run_number run_sha version_name release_json release_id latest_change body

            if [ "$EVENT_NAME" = "workflow_run" ]; then
              run_id="$RUN_ID"
              run_number="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.run_number')"
              run_sha="$RUN_SHA"
            else
              run_json="$(gh api "repos/$REPO/actions/workflows/$workflow_file/runs?status=success&branch=main&per_page=1")"
              run_id="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].id // empty')"
              if [ -z "$run_id" ]; then
                echo "No successful run found for $workflow_file"
                return 0
              fi
              run_number="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].run_number')"
              run_sha="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].head_sha')"
            fi

            version_name="1.0.${run_number}"

            release_json="$(gh api "repos/$REPO/releases/tags/$tag" 2>/dev/null || true)"
            if [ -z "$release_json" ]; then
              echo "Creating missing release $tag"
              gh release create "$tag" --repo "$REPO" --title "$app $version_name" --notes "Latest update."
              release_json="$(gh api "repos/$REPO/releases/tags/$tag")"
            fi

            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            latest_change="$(gh api "repos/$REPO/commits/$run_sha" --jq '.commit.message' | head -n 1 | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$latest_change" ] || latest_change="Latest bug fixes and improvements."

            body="## What's New

- $latest_change

## Build information

Version code: $run_number
Version name: $version_name"

            gh api "repos/$REPO/releases/$release_id" -X PATCH \
              -f "name=$app $version_name" \
              -f "body=$body" >/dev/null

            echo "Updated $tag -> $version_name (build $run_number)"
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            case "$WORKFLOW_NAME" in
              "Build Android App")
                update_release "build-android.yml" "android-latest" "Rizvi Diagnostic Center"
                ;;
              "Build Superadmin Android App")
                update_release "build-superadmin-android.yml" "android-superadmin-latest" "Rizvi Diagnostic Center Superadmin"
                ;;
              *)
                echo "Ignoring unrelated workflow: $WORKFLOW_NAME"
                ;;
            esac
          else
            update_release "build-android.yml" "android-latest" "Rizvi Diagnostic Center"
            update_release "build-superadmin-android.yml" "android-superadmin-latest" "Rizvi Diagnostic Center Superadmin"
          fi
