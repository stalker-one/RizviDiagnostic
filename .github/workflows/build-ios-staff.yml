name: Build iOS Staff Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios-staff.yml'

jobs:
  build-ios-staff:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and repair lockfile drift
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Capacitor installation
        working-directory: frontend
        run: |
          node --version
          npm --version
          npx cap --version

      - name: Build Staff web application
        working-directory: frontend
        run: npm run build

      - name: Add Capacitor iOS platform
        working-directory: frontend
        run: npx cap add ios

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap sync ios

      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Rizvi-Diagnostic-Center-iOS-Staff
          path: frontend/ios
          if-no-files-found: error
